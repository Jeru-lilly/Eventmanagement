<!-- Toggle Registration Script -->

<script>

    (function() {

        const regSection = document.getElementById('registration');
        const toggleBtn = document.getElementById('registerBtn');

        if (regSection && toggleBtn) {

            // Initially hidden (set by CSS)

            toggleBtn.addEventListener('click', function(e) {

                e.preventDefault();

                // Toggle visibility

                regSection.classList.toggle('visible');

                // Change button text

                if (regSection.classList.contains('visible')) {

                    toggleBtn.textContent = 'Close Registration';
                    toggleBtn.classList.add('register-btn');

                } else {

                    toggleBtn.textContent = 'Register Now';

                }

            });

        }

    })();

</script>
