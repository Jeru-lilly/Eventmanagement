<!DOCTYPE html>
<html>
<head>
    <title>Fashion Boutique Order</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

<div class="box">

    <h2>Fashion Boutique</h2>

    <label>Customer Name</label>
    <input type="text" id="name">

    <label>Select Outfit</label>
    <select id="outfit">
        <option value="899">Floral Dress - ₹899</option>
        <option value="1299">Denim Jacket - ₹1299</option>
        <option value="999">Casual Top - ₹999</option>
        <option value="1499">Party Gown - ₹1499</option>
    </select>

    <label>Quantity</label>
    <input type="number" id="qty" value="1" min="1">

    <label>Delivery</label>
    <select id="delivery">
        <option value="0">Store Pickup - Free</option>
        <option value="100">Home Delivery - ₹100</option>
    </select>

    <br><br>

    <button onclick="orderNow()">Place Order</button>

    <h3>Order Details</h3>

    <p>Customer : <span id="cname"></span></p>
    <p>Product Cost : ₹<span id="cost"></span></p>
    <p>Delivery : ₹<span id="charge"></span></p>
    <p><b>Total : ₹<span id="total"></span></b></p>

</div>

<script>
function orderNow()
{
    var name = document.getElementById("name").value;

    var price = parseInt(document.getElementById("outfit").value);

    var qty = parseInt(document.getElementById("qty").value);

    var delivery = parseInt(document.getElementById("delivery").value);

    var total = (price * qty) + delivery;

    document.getElementById("cname").innerHTML = name;
    document.getElementById("cost").innerHTML = price * qty;
    document.getElementById("charge").innerHTML = delivery;
    document.getElementById("total").innerHTML = total;
}
</script>

</body>
</html>
